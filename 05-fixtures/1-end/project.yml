include:
  - ../../constants.yml
targets:
  Albertos:
    type: application
    platform: iOS
    sources:
      - ../../04-tdd-in-the-real-world/1-end/Albertos/AlbertosApp.swift
      - ../../04-tdd-in-the-real-world/1-end/Albertos/MenuList.swift
      - ../../04-tdd-in-the-real-world/1-end/Albertos/MenuGrouping.swift
      - ../../04-tdd-in-the-real-world/1-end/Albertos/MenuSection.swift
      - Albertos
    scheme:
      testTargets: [AlbertosTests]
  AlbertosTests:
    target: Albertos
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../../Packages/CollectionSafe/Sources/Collection+Safe.swift
      - AlbertosTests
    settings:
      # No need for code signing in this demo, plus, it's the test target
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Albertos
