include:
  - ../constants.yml
  - ../quick-and-nimble.yml
packages:
  HippoPayments:
    path: ../Packages/HippoPayments
  HippoAnalytics:
    path: ../Packages/HippoAnalytics
targets:
  Albertos:
    type: application
    platform: iOS
    sources: [Albertos]
    scheme:
      testTargets: [AlbertosTests]
    dependencies:
      - package: HippoPayments
      - package: HippoAnalytics
  AlbertosTests:
    target: Albertos
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Packages/CollectionSafe/Sources/Collection+Safe.swift
      - ../06-testing-static-swiftui-views/1-end/AlbertosTests/MenuItem+Fixture.swift
      - ../06-testing-static-swiftui-views/1-end/AlbertosTests/MenuSection+Fixture.swift
      - ../08-stub/1-end/AlbertosTests/MenuFetchingStub.swift
      - ../08-stub/1-end/AlbertosTests/TestError.swift
      - ../09-json-decoding/1-end/AlbertosTests/MenuItem+JSONFixture.swift
      - ../09-json-decoding/1-end/AlbertosTests/XCTestCase+JSON.swift
      - ../09-json-decoding/1-end/AlbertosTests/menu_item.json
      - ../10-networking/1-end/AlbertosTests/NetworkFetchingStub.swift
      - ../12-spy/1-end/AlbertosTests/PaymentProcessingSpy.swift
      - ../13-testing-view-presentation/1-end/AlbertosTests/PaymentProcessingStub.swift
      - ../13-testing-view-presentation/1-end/AlbertosTests/XCTestCase+Timeouts.swift
      - ../15-fake-and-dummy/1-end/AlbertosTests/OrderStoringFake.swift
      - ../15-fake-and-dummy/1-end/AlbertosTests/PaymentProcessingDummy.swift
      # - ../17-appendix-b-nimble-only/AlbertosTests
      - AlbertosTests
    settings:
      # No need for code signing in this demo, plus, it's the test target
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Albertos
      - package: Nimble
