include:
  - ../../constants.yml
targets:
  Albertos:
    type: application
    platform: iOS
    sources: [Albertos]
    info:
      path: Albertos/Info.plist
      properties:
        UILaunchScreen:
          UIRequiredDeviceCapabilities: [armv7]
    scheme:
      testTargets: [AlbertosTests]
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Format
        script: swift run -c release --package-path ../../BuildTools swiftformat "$SRCROOT"
        basedOnDependencyAnalysis: false
  AlbertosTests:
    target: Albertos
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../../Packages/CollectionSafe/Sources/Collection+Safe.swift
      - AlbertosTests
    settings:
      # No need for code signing in this demo, plus, it's the test target
      CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Albertos
